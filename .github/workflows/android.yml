
name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Debug Android Manifest
        run: |
          echo "Checking manifest file..."
          ls -la app/src/main/
          cat -A app/src/main/AndroidManifest.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML VALID')"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --info

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Smart-SMS-Manager-APK
          path: app/build/outputs/apk/debug/app-debug.apk
